
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | default: 'KaaKazini User Guide' | escape }}</title>

  <meta name="description" content="{{ page.description | default: site.description | default: 'KaaKazini user documentation.' | escape }}">
  <meta name="theme-color" content="#fff000">

  <!-- Browser tab icon -->
  <link rel="icon" type="image/jpeg" href="{{ '/assets/images/kazika.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/kazika.jpg' | relative_url }}">

  <!-- Raleway font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <a class="skip-link" href="#main-content">Skip to content</a>

  <nav class="site-nav" aria-label="Main navigation">
    <a class="nav-brand" href="{{ '/' | relative_url }}" aria-label="KaaKazini User Guide home">
      <img
        src="{{ '/assets/images/kazika.jpg' | relative_url }}"
        alt=""
        class="nav-logo"
        width="44"
        height="44"
      >
      <span>KaaKazini</span>
    </a>

    <a class="nav-guide-link" href="{{ '/' | relative_url }}">
      User Guide
    </a>
  </nav>

  <header class="page-header">
    <a class="header-logo-link" href="{{ '/' | relative_url }}" aria-label="KaaKazini home">
      <img
        src="{{ '/assets/images/kazika.jpg' | relative_url }}"
        alt="KaaKazini logo"
        class="header-logo"
        width="88"
        height="88"
      >
    </a>

    <h1 class="project-name">
      {{ site.title | default: 'KaaKazini User Guide' | escape }}
    </h1>

    {% if site.description %}
      <p class="project-tagline">{{ site.description | escape }}</p>
    {% endif %}
  </header>

  <main id="main-content" class="main-content">
    {{ content }}

    <footer class="site-footer">
      <p class="site-footer-owner">KaaKazini User Guide</p>
      <p class="site-footer-credits">Built to help users navigate KaaKazini.</p>
    </footer>
  </main>

</body>
</html>
